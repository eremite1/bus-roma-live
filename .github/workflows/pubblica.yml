name: Aggiorna dati e pubblica il sito

on:
  schedule:
    - cron: '17 2 * * *'   # ogni notte verso le 3-4 (ora italiana): nuovi orari ATAC
  push:
    branches: [main]       # ogni modifica al codice ripubblica il sito
  workflow_dispatch:        # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica gli orari ATAC e prepara i dati
        # Di notte (o a mano) rifà sempre i dati; dopo una modifica al codice solo se mancano.
        if: github.event_name != 'push' || hashFiles('data/trips.json') == '' || hashFiles('data/linestops.json') == '' || hashFiles('data/blocks.json') == '' || hashFiles('data/giorni/indice.json') == ''
        continue-on-error: true   # se Roma Mobilità non risponde, si tengono i dati del giorno prima
        run: python tools/build_static.py

      - name: Tempi deposito-capolinea visti dal GPS (vetture che escono già con la corsa)
        continue-on-error: true
        run: |
          git fetch -q origin storico || exit 0
          python - <<'PY'
          import json, subprocess, statistics
          from datetime import date, timedelta
          files = subprocess.run(["git", "ls-tree", "--name-only", "origin/storico", "uscite/"], capture_output=True, text=True).stdout.split()
          da = (date.today() - timedelta(days=30)).isoformat()
          obs = {}
          for f in files:
              if f.split("/")[-1][:10] < da:
                  continue
              for x in json.loads(subprocess.run(["git", "show", "origin/storico:" + f], capture_output=True, text=True).stdout or "[]"):
                  if x.get("coll"):
                      continue  # dove c'è il collegamento l'orario è già certo
                  obs.setdefault((x["D"], x["p"]), []).append((x["m"], x["h"]))
          p = "data/tempi_veri.json"; t = json.load(open(p))
          n = 0
          for (D, pl), v in obs.items():
              if len(v) < 3:
                  continue
              m = round(statistics.median(a for a, _ in v)); h = round(statistics.median(b for _, b in v))
              old = t.get(D, {}).get(pl)
              if old and len(old) < 3 and len(v) < 5:
                  continue  # il dato dato da un autista vale finché il GPS non ha almeno 5 uscite
              t.setdefault(D, {})[pl] = [m, h, len(v)]; n += 1
          json.dump(t, open(p, "w"), ensure_ascii=False, indent=1)
          print("capolinea con tempi dal GPS:", n)
          PY

      - name: Aggiungi i nomi delle tabelle confermati con le foto
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request
          try:
              sh = json.load(urllib.request.urlopen("https://bus-roma.carlettibus.workers.dev/nomi", timeout=20))
          except Exception as e:
              print("ponte non raggiungibile:", e); raise SystemExit(0)
          p = "data/tabelle.json"; d = json.load(open(p))
          new = {k: v for k, v in (sh.get("nomi") or {}).items() if k not in d}
          d.update(new); json.dump(d, open(p, "w"), ensure_ascii=False, indent=1)
          p = "data/tempi_veri.json"; t = json.load(open(p))
          for x in sh.get("tempi") or []:
              t.setdefault(x["D"], {}).setdefault(x["p"], [x["m"], x["h"]])
          json.dump(t, open(p, "w"), ensure_ascii=False, indent=1)
          print("nomi nuovi:", len(new))
          PY

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna novità nei dati"
          else
            git commit -m "Dati ATAC aggiornati $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Prepara il sito
        run: |
          # BETA = ultimo codice (ramo main), in /beta/ ; PUBBLICA = ramo "stabile", nella pagina principale
          mkdir -p _site/beta
          cp -r index.html config.js css js data _site/beta/
          git fetch -q origin stabile && git worktree add -f stabile origin/stabile
          cp -r stabile/index.html stabile/config.js stabile/css stabile/js _site/
          cp -r data _site/
          for D in _site _site/beta; do
            V=$( [ "$D" = _site ] && git -C stabile rev-parse --short=8 HEAD || echo ${GITHUB_SHA::8} )
            # versione nei nomi dei file: telefoni e browser scaricano subito il codice nuovo
            sed -i -E "s#(src|href)=\"(js|css)/([^\"?]+)\"#\1=\"\2/\3?v=$V\"#g" $D/index.html
            sed -i -E "s#from '\./([^'?]+\.js)'#from './\1?v=$V'#g; s#import\('\./([^'?]+\.js)'\)#import('./\1?v=$V')#g" $D/js/*.js
          done
          [ -f favicon.svg ] && cp favicon.svg _site/ && cp favicon.svg _site/beta/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
