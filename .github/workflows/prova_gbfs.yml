name: Prova monopattini (una tantum)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prova_gbfs.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          for u in \
            https://data.lime.bike/api/partners/v2/gbfs/rome/gbfs.json \
            https://data.lime.bike/api/partners/v2/gbfs/roma/gbfs.json \
            https://data.lime.bike/api/partners/v2/gbfs/rome/free_bike_status.json \
            https://data.lime.bike/api/partners/v1/gbfs/rome/free_bike_status.json \
            https://gbfs.api.ridedott.com/public/v2/rome/gbfs.json \
            https://gbfs.api.ridedott.com/public/v2/roma/gbfs.json \
            https://mds.bird.co/gbfs/v2/public/rome/gbfs.json \
            https://api.transitous.org/api/v1/rentals?min=41.88,12.47\&max=41.91,12.51 ; do
            code=$(curl -s -m 20 -o tmp -w "%{http_code}" "$u"); echo "$code $u $(head -c 300 tmp | tr '\n' ' ')" >> risultati.txt
          done
          cat risultati.txt
      - run: |
          cd out
          git init -q; git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -q -b prova-gbfs; git add risultati.txt; git commit -qm prova
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prova-gbfs
