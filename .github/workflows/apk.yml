name: Crea APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rinomina
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../BusRomaLive.apk
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/d' > ../novita.txt
      - name: Pubblica
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bus Roma Live 1.0.${{ github.run_number }}
          files: BusRomaLive.apk
          body_path: novita.txt
          make_latest: true
